# Project-wide Gradle settings

# Gradle settings for this project, affects all subprojects/modules.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# the build.gradle file in the project root folder for more details about this.

# When configured, Gradle will run in offline mode and disables network operations during the build.
org.gradle.offline=false

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines.
org.gradle.jvmargs=-Xmx4096m

# When set to true the Gradle daemon is used to build the project using all the specified build parameters.
# This is recommended for CI/CD pipelines.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin configuration
kotlin.code.style=official

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Enable R8 code shrinking in release builds
android.enableR8=true

# Store release signing credentials
# IMPORTANT: DO NOT COMMIT ACTUAL CREDENTIALS TO VERSION CONTROL
# Use local.properties or environment variables for sensitive data
# Example: storeFile=/path/to/keystore.jks
# Example: storePassword=keystore-password
# Example: keyAlias=key-alias
# Example: keyPassword=key-password

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
